{% extends "base.html" %}

{% block title %}Password Reset Complete · DJGO{% endblock %}

{% block content %}
<div class="container-xxl py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card-v p-4 text-center">
                <div class="mb-3">
                    <span class="rounded-circle d-inline-flex align-items-center justify-content-center"
                        style="width:3.5rem;height:3.5rem;background:rgba(40,167,69,.12);color:var(--moss, #28a745);font-size:1.6rem">
                        <i class="bi bi-check-circle"></i>
                    </span>
                </div>
                <h1 class="h3 mb-2">Password reset complete</h1>
                <p class="text-smoke small mb-4">
                    Your password has been changed successfully. You can now sign in with your new credentials.
                </p>

                <a href="{% url 'accounts:login' %}" class="btn btn-dark w-100 rounded-pill py-2">
                    Sign in to Your Account
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
